<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrasi QR Code</title>
    <!-- Library untuk Generate QR Code -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <!-- Library untuk Scan QR Code -->
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <!-- Library Trystero untuk P2P Auto-Discovery -->
    <script src="https://unpkg.com/trystero@0.20.0/dist/trystero-mqtt.min.js"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            color: #000;
        }

        /* Halaman Registrasi Styling */
        h1.title { font-size: 28px; margin-bottom: 20px; }
        .input-group { margin-bottom: 20px; }
        .input-group input {
            font-size: 16px; padding: 5px; border: 1px solid #777; width: 250px;
        }
        #reg-nama { background-color: #eaf1fb; }
        .btn-generate {
            padding: 5px 10px; font-size: 16px; border: 1px solid #777;
            background-color: #f0f0f0; cursor: pointer;
        }
        .btn-generate:hover { background-color: #e0e0e0; }
        #qrcode-container { margin-top: 20px; }

        /* Admin & Global Styling */
        .hidden { display: none !important; }
        .admin-container {
            max-width: 600px; margin: auto; padding: 20px;
            border: 1px solid #ccc; border-radius: 8px; background: #fafafa;
        }
        .btn-admin {
            padding: 8px 15px; background: #007bff; color: white;
            border: none; cursor: pointer; margin-right: 5px; margin-bottom: 10px;
            border-radius: 4px;
        }
        .btn-admin.danger { background: #dc3545; }
        .btn-admin.success { background: #28a745; }
        
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        table, th, td { border: 1px solid #ccc; }
        th, td { padding: 8px; text-align: left; }

        .sync-box {
            background: #e9ecef; border: 1px dashed #6c757d; padding: 15px; border-radius: 5px; margin-bottom: 20px;
            text-align: center;
        }
        .badge-status {
            display: inline-block; padding: 5px 12px; border-radius: 15px; font-size: 14px; font-weight: bold; color: white; background: #ff9800;
        }
        .badge-status.on { background: #28a745; }
    </style>
</head>
<body>

    <!-- ================= VIEW: REGISTRASI ================= -->
    <div id="view-registrasi">
        <h1 class="title">Registrasi</h1>
        <div class="input-group">
            <input type="text" id="reg-nama" placeholder="Nama Lengkap">
        </div>
        <div class="input-group">
            <input type="text" id="reg-nim" placeholder="Nomor/NIM">
        </div>
        <button class="btn-generate" onclick="generateQR()">Generate QR</button>
        <div id="qrcode-container"></div>
    </div>

    <!-- ================= VIEW: ADMIN LOGIN ================= -->
    <div id="view-login" class="hidden admin-container">
        <h2>Akses Admin</h2>
        <input type="password" id="admin-pass" placeholder="Masukkan Password" style="padding: 5px; font-size: 16px;">
        <button class="btn-admin success" onclick="loginAdmin()">Login</button>
        <p id="login-error" style="color: red; display: none;">Password salah!</p>
    </div>

    <!-- ================= VIEW: ADMIN DASHBOARD ================= -->
    <div id="view-admin" class="hidden admin-container">
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <h2>Admin Scanner</h2>
            <button class="btn-admin danger" onclick="logoutAdmin()">Logout</button>
        </div>
        
        <!-- P2P Sync Section (Auto) -->
        <div class="sync-box">
            <h3 style="margin-top: 0; margin-bottom: 10px;">Sinkronisasi Perangkat (Otomatis)</h3>
            <span id="p2p-status" class="badge-status">Mencari Perangkat Lain... (0)</span>
            <p style="font-size: 12px; color: #555; margin-top:10px;">
                Saat ada perangkat admin lain login, sistem akan <b>saling bertukar data (dua arah)</b>. Data kembar/duplikat akan otomatis ditolak.
            </p>
        </div>

        <div id="reader" style="width: 100%; margin-bottom: 20px;"></div>
        
        <hr>
        <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 15px;">
            <h3 style="margin: 0;">Data Scan (<span id="total-data">0</span>)</h3>
            <div>
                <button class="btn-admin success" onclick="downloadData()">⬇️ Download Excel</button>
                <button class="btn-admin danger" onclick="clearData()">Hapus</button>
            </div>
        </div>
        
        <table>
            <thead>
                <tr>
                    <th>Waktu Scan</th>
                    <th>Nama</th>
                    <th>NIM/ID</th>
                </tr>
            </thead>
            <tbody id="data-list">
                <!-- Data List -->
            </tbody>
        </table>
    </div>

    <script>
        // --- ROUTING SYSTEM ---
        function checkRoute() {
            const hash = window.location.hash;
            document.getElementById('view-registrasi').classList.add('hidden');
            document.getElementById('view-login').classList.add('hidden');
            document.getElementById('view-admin').classList.add('hidden');
            
            if (hash === '#/adminmaksiber') {
                if (sessionStorage.getItem('adminLoggedIn') === 'true') {
                    document.getElementById('view-admin').classList.remove('hidden');
                    startScanner();
                    renderData();
                    initP2P(); // Mulai Auto-Sync Dua Arah
                } else {
                    document.getElementById('view-login').classList.remove('hidden');
                    stopScanner();
                }
            } else {
                document.getElementById('view-registrasi').classList.remove('hidden');
                stopScanner();
            }
        }
        window.addEventListener('hashchange', checkRoute);
        window.addEventListener('load', checkRoute);

        // --- REGISTRASI (Generate QR) ---
        function generateQR() {
            const nama = document.getElementById('reg-nama').value.trim();
            const nim = document.getElementById('reg-nim').value.trim();
            if(!nama || !nim) return alert("Harap isi Nama dan Nomor/NIM terlebih dahulu!");
            
            const dataStr = JSON.stringify({ nama: nama, nim: nim });
            const container = document.getElementById('qrcode-container');
            container.innerHTML = "";
            new QRCode(container, { text: dataStr, width: 200, height: 200, colorDark : "#000", colorLight : "#fff", correctLevel : QRCode.CorrectLevel.H });
        }

        // --- ADMIN AUTH ---
        function loginAdmin() {
            if (document.getElementById('admin-pass').value === '111111') {
                sessionStorage.setItem('adminLoggedIn', 'true');
                document.getElementById('login-error').style.display = 'none';
                document.getElementById('admin-pass').value = '';
                checkRoute();
            } else {
                document.getElementById('login-error').style.display = 'block';
            }
        }
        function logoutAdmin() {
            sessionStorage.removeItem('adminLoggedIn');
            checkRoute();
        }

        // --- SCANNER LOGIC ---
        let html5QrcodeScanner;
        function startScanner() {
            if (html5QrcodeScanner) return;
            html5QrcodeScanner = new Html5QrcodeScanner("reader", { fps: 10, qrbox: {width: 250, height: 250} }, false);
            html5QrcodeScanner.render(onScanSuccess, () => {});
        }
        function stopScanner() {
            if (html5QrcodeScanner) {
                html5QrcodeScanner.clear().catch(e => console.error(e));
                html5QrcodeScanner = null;
            }
        }

        function onScanSuccess(decodedText) {
            try {
                const data = JSON.parse(decodedText);
                if(!data.nim || !data.nama) throw new Error("Invalid");

                let storedData = JSON.parse(localStorage.getItem('qrDataPeserta') || '[]');
                
                // VALIDASI: Hanya bisa scan sekali berdasarkan NIM/ID
                const isAlreadyScanned = storedData.some(item => item.nim === data.nim);
                
                if (isAlreadyScanned) {
                    alert(`❌ PERINGATAN!\nPeserta dengan Nama: ${data.nama} SUDAH PERNAH DISCAN! (Data Ditolak)`);
                } else {
                    data.waktu_scan = new Date().toLocaleString('id-ID');
                    storedData.push(data);
                    localStorage.setItem('qrDataPeserta', JSON.stringify(storedData));
                    
                    alert(`✅ BERHASIL!\nData ${data.nama} disimpan.`);
                    renderData();
                    
                    // BROADCAST (Live Sync) data baru ini ke semua perangkat yang sedang aktif
                    if (sendSyncData) {
                        sendSyncData([data]); 
                    }
                }
            } catch(e) {
                alert("❌ QR Code tidak valid atau bukan dari sistem ini.");
            }
        }

        function renderData() {
            let storedData = JSON.parse(localStorage.getItem('qrDataPeserta') || '[]');
            const tbody = document.getElementById('data-list');
            document.getElementById('total-data').innerText = storedData.length;
            tbody.innerHTML = '';
            
            // Urutkan dari data paling baru ke lama saat ditampilkan
            [...storedData].reverse().forEach(item => {
                const tr = document.createElement('tr');
                tr.innerHTML = `<td>${item.waktu_scan}</td><td>${item.nama}</td><td>${item.nim}</td>`;
                tbody.appendChild(tr);
            });
        }
        
        function clearData() {
            if(confirm("Yakin ingin menghapus semua data di perangkat ini? Pastikan Anda sudah mendownloadnya terlebih dahulu!")) {
                localStorage.removeItem('qrDataPeserta');
                renderData();
            }
        }

        // --- DOWNLOAD DATA KE EXCEL (CSV) ---
        function downloadData() {
            let storedData = JSON.parse(localStorage.getItem('qrDataPeserta') || '[]');
            if (storedData.length === 0) {
                return alert("Tidak ada data untuk didownload.");
            }

            // Membuat header CSV
            let csvContent = "Waktu Scan,Nama Lengkap,NIM / Nomor ID\n";

            // Memasukkan data ke CSV dengan aman (menghindari error jika ada koma di nama)
            storedData.forEach(item => {
                let waktu = `"${item.waktu_scan}"`;
                let nama = `"${item.nama}"`;
                let nim = `"${item.nim}"`;
                csvContent += `${waktu},${nama},${nim}\n`;
            });

            // Trigger unduhan file
            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement("a");
            link.setAttribute("href", url);
            link.setAttribute("download", `Data_Scanner_Maksiber_${new Date().getTime()}.csv`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        // ==========================================
        // FITUR P2P AUTO-DISCOVERY (SINKRON DUA ARAH)
        // ==========================================
        let room;
        let sendSyncData;
        let getSyncData;
        let connectedPeers = 0;
        let p2pInitialized = false;

        function initP2P() {
            if (p2pInitialized) return;
            p2pInitialized = true;

            try {
                // Room unik untuk aplikasi ini agar tidak bentrok dengan aplikasi lain di internet
                const config = { appId: 'maksiber-qr-sync-2026' };
                room = trystero.joinRoom(config, 'admin-room');

                // Action untuk berbagi data
                const syncAction = room.makeAction('sync_data');
                sendSyncData = syncAction[0];
                getSyncData = syncAction[1];

                // EVENT: KETIKA ADA PERANGKAT LAIN TERHUBUNG (Berlaku 2 Arah)
                // HP 1 melihat HP 2 masuk -> HP 1 kirim data ke HP 2
                // HP 2 melihat HP 1 ada di dalam -> HP 2 kirim data ke HP 1
                room.onPeerJoin(peerId => {
                    connectedPeers++;
                    updateP2PUI();

                    let storedData = JSON.parse(localStorage.getItem('qrDataPeserta') || '[]');
                    if (storedData.length > 0) {
                        sendSyncData(storedData, peerId);
                    }
                });

                // EVENT: KETIKA PERANGKAT LAIN KELUAR / OFFLINE
                room.onPeerLeave(peerId => {
                    connectedPeers = Math.max(0, connectedPeers - 1);
                    updateP2PUI();
                });

                // EVENT: KETIKA MENERIMA DATA DARI PERANGKAT LAIN
                getSyncData((incomingData, peerId) => {
                    gabungkanData(incomingData);
                });

            } catch(e) {
                console.log("P2P Init Error:", e);
            }
        }

        // FUNGSI GABUNGKAN DATA (DENGAN ANTI-DUPLIKASI)
        function gabungkanData(incomingArray) {
            if (!Array.isArray(incomingArray)) return;

            let storedData = JSON.parse(localStorage.getItem('qrDataPeserta') || '[]');
            let dataDitambah = false;

            incomingArray.forEach(incomingItem => {
                // PENGECEKAN DUPLIKASI BERDASARKAN NIM/NOMOR ID
                const exists = storedData.some(item => item.nim === incomingItem.nim);
                
                // Jika NIM belum ada di database lokal, baru masukkan!
                if (!exists && incomingItem.nim) {
                    storedData.push(incomingItem);
                    dataDitambah = true;
                }
            });

            // Render ulang tabel HANYA JIKA ada data baru yang masuk (efisiensi memori)
            if (dataDitambah) {
                localStorage.setItem('qrDataPeserta', JSON.stringify(storedData));
                renderData();
            }
        }

        function updateP2PUI() {
            const statusEl = document.getElementById('p2p-status');
            if (connectedPeers > 0) {
                statusEl.innerText = `Terhubung (Live dengan ${connectedPeers} perangkat)`;
                statusEl.classList.add('on');
            } else {
                statusEl.innerText = "Mencari Perangkat Lain... (0)";
                statusEl.classList.remove('on');
            }
        }

    </script>
